name: probe-latest
on:
  push:
    branches: [probe-latest]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - uses: astral-sh/setup-uv@v6
      - name: install dev group, then upgrade every dependency
        run: |
          uv sync --group dev --python ${{ matrix.py }}
          uv lock --upgrade && uv sync --group dev --python ${{ matrix.py }}
          uv pip list
      - name: tests with warnings shown
        run: uv run pytest tests/unit -q -rfEw -W default -p no:cacheprovider --maxfail=50 2>&1 | tail -150
